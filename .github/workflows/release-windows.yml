name: Build & Release (Windows)

# Scoped GitHub Actions usage: GitHub is a read-only mirror of Codeberg, and the
# only reason Actions runs here is Windows, the one platform we cannot build
# locally (Flutter does not cross-compile Windows from macOS). macOS/Android/Linux
# assets are built locally/self-hosted and uploaded to the same Release with:
#   gh release upload <tag> BiblioGenius-macOS.dmg BiblioGenius-Android.apk BiblioGenius-Linux.tar.gz
#
# Trigger: a `v*` tag pushed on Codeberg is propagated to GitHub by the push
# mirror, which fires this workflow. `workflow_dispatch` allows manual testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Keep in sync with the Flutter version you build with locally
  # (pubspec Dart SDK constraint is ^3.10.1). Bump if `flutter --version` differs.
  FLUTTER_VERSION: '3.38.4'

jobs:
  # =============================================================================
  # BUILD RUST BACKEND (standalone bibliogenius.exe, injected into the bundle)
  # =============================================================================
  build-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bibliogenius/bibliogenius

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust backend
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bibliogenius-windows-x64
          path: target/x86_64-pc-windows-msvc/release/bibliogenius.exe

  # =============================================================================
  # BUILD FLUTTER WINDOWS APP
  # =============================================================================
  build-windows:
    needs: build-rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CMakeLists.txt (rust_builder/windows) finds the Rust source at this path
      - name: Clone Rust repository
        run: git clone https://github.com/bibliogenius/bibliogenius.git rust_builder/bibliogenius

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Create .env file
        run: copy .env.example .env

      - name: Get dependencies
        run: flutter pub get

      - name: Download Rust Backend
        uses: actions/download-artifact@v4
        with:
          name: bibliogenius-windows-x64
          path: backend

      - name: Build Windows app
        run: flutter build windows --release

      - name: Inject Rust Binary
        run: |
          mkdir build\windows\x64\runner\Release\backend
          copy backend\bibliogenius.exe build\windows\x64\runner\Release\backend\

      - name: Create ZIP
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath BiblioGenius-Windows.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: bibliogenius-windows
          path: BiblioGenius-Windows.zip

  # =============================================================================
  # CREATE / UPDATE GITHUB RELEASE (Windows asset only; others uploaded via gh)
  # =============================================================================
  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: "!contains(github.ref, '-ci')"
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: bibliogenius-windows
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            # BiblioGenius ${{ github.ref_name }}

            Cross-platform personal library: catalog, peer-to-peer sharing, end-to-end
            encrypted messaging, loans, local encrypted backups.

            ## Downloads

            | Platform | Status | File |
            |----------|--------|------|
            | **macOS** | Signed and notarized | `BiblioGenius-macOS.dmg` |
            | **Android** | Google Play (preferred) | `BiblioGenius-Android.apk` (sideload) |
            | **Windows** | Automated, lightly tested | `BiblioGenius-Windows.zip` |
            | **Linux** | Automated, lightly tested | `BiblioGenius-Linux.tar.gz` |

            > Windows is built here on CI. macOS, Android and Linux assets are built
            > and signed locally and attached to this same release.

            ## Getting started
            - **Windows**: extract the ZIP, run `bibliogenius.exe`
            - **macOS**: open the `.dmg`, drag to Applications
            - **Android**: install via Google Play, or sideload the APK
            - **Linux**: extract the tarball, run `./bibliogenius`

            Source of truth and issues: https://codeberg.org/bibliogenius/bibliogenius-app
          files: |
            artifacts/BiblioGenius-Windows.zip
