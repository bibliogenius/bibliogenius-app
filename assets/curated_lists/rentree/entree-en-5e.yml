# Entree en 5e - lectures de rentree
#
# Structure: the four literary entries of the NEW French programme for the
# classe de 5e (BO du 5 mars 2026), which applies to 5e from the September 2026
# rentree. The same reform reaches 4e in 2027 and 3e in 2028, which is why this
# list is per level and not "cycle 4": that cycle has no coherent programme
# before 2028. Add the next level the year it switches.
#
# The programme prescribes an entry and a genre, never a title or an edition:
# every book below is an editorial choice. Genres are respected, the poetry
# entry holds poetry and the theatre entry holds theatre.
#
# REVIEW DEADLINE: nothing to do before the 2027 rentree, when the 4e switches
# and deserves its own list. Bump `version` if this selection changes.
#
# Editions were picked among ISBNs attested by catalogue.bnf.fr, preferring the
# widely held paperback over the most recent printing: it is the one a family
# is most likely to own already, which is what the owned/total badge compares.
id: entree-en-5e
version: 1

title:
  fr: "Entrée en 5e - lectures de rentrée"
  en: "Starting Year 8 - back-to-school reading"
  es: "Entrada en 5e - lecturas de vuelta al cole"
  de: "Eintritt in die 5. Klasse - Lektüre zum Schulbeginn"

description:
  fr: "Onze lectures pour la 5e, une par entrée du nouveau programme de français : devenir héros, voyager en poésie, jouer le théâtre, imaginer et raisonner. Structure d'après le programme publié au Bulletin officiel du 5 mars 2026, applicable à la 5e depuis la rentrée 2026. Éditions de poche courantes, vérifiées au catalogue de la BnF."
  en: "Eleven books for the second year of French collège, mapped onto the new French-language curriculum strands: becoming a hero, travelling through poetry, playing theatre, imagining and reasoning. Structure follows the programme published in the Bulletin officiel of 5 March 2026, in force for that year since the 2026 rentree. Current paperback editions, checked against the BnF catalogue."
  es: "Once lecturas para el segundo curso del collège francés, organizadas según los ejes del nuevo programa de francés: convertirse en héroe, viajar en poesía, jugar al teatro, imaginar y razonar. Estructura basada en el programa publicado en el Bulletin officiel del 5 de marzo de 2026. Ediciones de bolsillo actuales, verificadas en el catálogo de la BnF."
  de: "Elf Bücher für die 5. Klasse, geordnet nach den Themenfeldern des neuen französischen Lehrplans: Held werden, in der Poesie reisen, Theater spielen, sich vorstellen und begründen. Struktur nach dem im Bulletin officiel vom 5. März 2026 veröffentlichten Lehrplan. Aktuelle Taschenbuchausgaben, im BnF-Katalog geprüft."

cover_url: "https://inventaire.io/img/entities/90850eacc0c6cf9abba297ae868d85ed981c4590"
contributor: BiblioGenius
tags: [rentrée, collège, cinquième, école, jeunesse, classiques]
content_languages: [fr]

# Per-book `cover_url` is set ONLY where a cover was found on a free source AND
# opened to confirm it shows this exact edition: 10 of 11. It is not a fallback,
# the import service prefers it over the lookup result, so a wrong or dead URL
# is worse than none. The three without one let the lookup chain try at import.
#
# Checking the image is not optional. Rejected here: Gallimard's 9782070618606
# Grimm collection, whose cover turns out to be a livre-CD for young children,
# wrong register for a 5e list; and Inventaire's image for Tobie Lolness, which
# answers HTTP 200 with a zero-byte body (Open Library served it instead).
