# CM1 et CM2 - lectures de rentree
#
# Structure: the six literary entries of the NEW French programme for cycle 3
# (BO du 17 avril 2025). The rollout is now complete for that cycle: CM1 and
# 6e switched at the 2025 rentree, CM2 switches at the 2026 one. With
# entree-en-6e.yml this covers the whole cycle.
#
# The CM1-CM2 entries are NOT the ones the 6e list uses: the programme gives
# six here against five there, with their own wording and their own genres.
# The two lists are structurally distinct, not a duplicate.
#
# Two official constraints shaped this selection, and they are the reason it
# leans further towards youth literature than the collège lists do:
#   - five youth-literature works and two classics per level, read in full, as
#     a stated minimum;
#   - alternate the FORMS, "texte seul, album, BD". Hence two albums (Yakouba,
#     Otto) and one comic (Akissi), which entree-en-6e and entree-en-5e lack.
#
# REVIEW DEADLINE: nothing before the 2027 rentree. The cycle is fully switched
# and its programme is not scheduled to move again.
#
# Editions were picked among ISBNs attested by catalogue.bnf.fr, preferring the
# widely held paperback over the most recent printing: it is the one a family
# is most likely to own already, which is what the owned/total badge compares.
id: cm1-cm2
version: 1

title:
  fr: "CM1 et CM2 - lectures de rentrée"
  en: "Years 5 and 6 - back-to-school reading"
  es: "CM1 y CM2 - lecturas de vuelta al cole"
  de: "CM1 und CM2 - Lektüre zum Schulbeginn"

description:
  fr: "Onze lectures pour le CM1 et le CM2, réparties sur les six entrées du nouveau programme de français : héroïnes et héros, merveilleux et étrange, autres vies, morale, poésie, et le rapport aux autres. Structure d'après le programme publié au Bulletin officiel du 17 avril 2025, applicable au CM2 depuis la rentrée 2026. Albums, bande dessinée et romans, comme le programme le demande. Éditions courantes vérifiées au catalogue de la BnF."
  en: "Eleven books for the last two years of French primary school, spread over the six strands of the new French-language curriculum: heroines and heroes, the marvellous and the strange, other lives, morality, poetry, and how we stand with others. Structure follows the programme published in the Bulletin officiel of 17 April 2025. Picture books, a comic and novels, as the programme asks. Current editions checked against the BnF catalogue."
  es: "Once lecturas para los dos últimos cursos de primaria en Francia, repartidas en los seis ejes del nuevo programa de francés: heroínas y héroes, lo maravilloso y lo extraño, otras vidas, la moral, la poesía y la relación con los demás. Estructura basada en el programa publicado en el Bulletin officiel del 17 de abril de 2025. Álbumes, cómic y novelas, como pide el programa. Ediciones actuales verificadas en el catálogo de la BnF."
  de: "Elf Bücher für die letzten beiden Grundschuljahre, geordnet nach den sechs Themenfeldern des neuen französischen Lehrplans: Heldinnen und Helden, Wunderbares und Fremdes, andere Leben, Moral, Poesie und das Verhältnis zu anderen. Struktur nach dem im Bulletin officiel vom 17. April 2025 veröffentlichten Lehrplan. Bilderbücher, ein Comic und Romane, wie der Lehrplan es verlangt. Aktuelle Ausgaben, im BnF-Katalog geprüft."

cover_url: "https://inventaire.io/img/entities/8ea74f2e6e952638b0adf5b878c174ddb89632d9"
contributor: BiblioGenius
tags: [rentrée, primaire, CM1, CM2, école, jeunesse, album]
content_languages: [fr]

