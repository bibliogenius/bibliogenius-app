# Entree en 6e - lectures de rentree
#
# Structure: the five thematic entries of the French "culture litteraire et
# artistique" programme for classe de sixieme (BO du 17 avril 2025, applicable
# to sixieme since the 2025 rentree). The programme prescribes themes and
# genres, never titles or editions: every book below is an editorial choice,
# not an official prescription.
#
# BALANCE (version 2): the official selections aim for a mix of patrimonial
# works, classics of youth literature and RECENT works. Version 1 had none of
# the third kind, its most recent original text dating from 2000. Version 2
# adds Le Grand Mechant Renard (2015), Freres d'exil (2016) and Wonder (2014),
# one per thematic entry, and drops Pommaux's Thesee: same author and same
# collection as Ulysse aux mille ruses, so it was the one title here whose
# presence rested on the least.
#
# REVIEW DEADLINE: re-check before the September 2027 rentree. The same
# programme reaches CM2 at the 2026-2027 rentree, and a later revision would
# invalidate the section headings. Bump `version` when the selection changes.
#
# Every ISBN below was resolved against catalogue.bnf.fr (the first source in
# the backend lookup chain for 978-2 ISBNs) on 2026-08-19: title, author,
# publisher and year come from the BNF record for that exact ISBN.
id: entree-en-6e
version: 2

title:
  fr: "Entrée en 6e - lectures de rentrée"
  en: "Starting Year 7 - back-to-school reading"
  es: "Entrada en 6e - lecturas de vuelta al cole"
  de: "Eintritt in die 6. Klasse - Lektüre zum Schulbeginn"

description:
  fr: "Seize lectures pour aborder la 6e, une par grande entrée du programme de français : récits des origines, mots et merveilles, ruses en action, aventure et rencontre des monstres. Structure d'après le programme publié au Bulletin officiel du 17 avril 2025. Éditions de poche courantes, vérifiées au catalogue de la BnF."
  en: "Sixteen books for the start of the first year of French collège, mapped onto the official French-language curriculum strands: origin stories, words and wonders, trickery, adventure and encountering monsters. Structure follows the programme published in the Bulletin officiel of 17 April 2025. Current paperback editions, checked against the BnF catalogue."
  es: "Dieciséis lecturas para empezar el primer curso del collège francés, organizadas según los ejes del programa oficial de francés: relatos de los orígenes, palabras y maravillas, astucias, aventura y encuentro con los monstruos. Estructura basada en el programa publicado en el Bulletin officiel del 17 de abril de 2025. Ediciones de bolsillo actuales, verificadas en el catálogo de la BnF."
  de: "Sechzehn Bücher für den Start in die 6. Klasse, geordnet nach den Themenfeldern des französischen Lehrplans: Ursprungserzählungen, Worte und Wunder, List, Abenteuer und Begegnung mit Monstern. Struktur nach dem im Bulletin officiel vom 17. April 2025 veröffentlichten Lehrplan. Aktuelle Taschenbuchausgaben, im BnF-Katalog geprüft."

cover_url: "https://covers.openlibrary.org/b/isbn/9782070612758-L.jpg"
contributor: BiblioGenius
tags: [rentrée, collège, sixième, école, jeunesse, classiques]
content_languages: [fr]

# Audited against the sources on 2026-08-23 (make audit-curated): every
# ISBN resolves and every author matches, no finding of any severity,
# and no entry left unverified. Promoted so the editorial affinity tier
# may SUGGEST it (ADR-066); the import catalogue always showed it.
curation_status: reviewed

# Per-book `cover_url` is set ONLY where a cover was found on a free source AND
# opened to confirm it shows this exact edition: 16 of 16. It is not a fallback,
# the import service prefers it over the lookup result, so a wrong or dead URL
# is worse than none. The other seven entries carry no cover_url on purpose and
# let the BnF-first lookup chain supply one at import time.
#
# Where a printing had no cover anywhere, the entry was moved to a SIBLING
# printing of the same book that does, picked among ISBNs the BnF had already
# attested. The exact printing carries no editorial meaning here (the programme
# prescribes none), and the widely held paperback is also the one most likely
# to be on a shelf already, which is what the owned/total badge compares.
#
# Sources tried on 2026-08-19: covers.openlibrary.org, inventaire.io (works by
# `isbn:` URI, needs an `Accept: application/json` header) and the BnF
# `couverture` service, which answers HTTP 500 for every ark, GET and HEAD
# alike, so it contributes nothing today.
#
# Every candidate image was opened before being pinned, which caught three bad
# ones: Inventaire serves the Dyscool "lecture facilitée" cover for Tomek and
# the "intégrale" cover for the tome 1 ISBN, and Open Library serves a "Le
# Lion" cover for ISBN 2070334457, which the BnF attributes to Tournier's
# Vendredi. An ISBN match alone never proves the image is right.
books:
  # 1. Créer, recréer le monde : récits des origines
  - isbn: "9782211207973"
    note: "Ulysse aux mille ruses - Yvan Pommaux (d'après l'Odyssée d'Homère)"
    publisher: "L'École des loisirs"
    published_date: "2011"
    authors: ["Yvan Pommaux"]
    description: "Le retour d'Ulysse raconté et illustré comme un album-BD : le cyclope, Circé, les sirènes, puis Ithaque. La porte d'entrée la plus lisible vers l'Odyssée pour un lecteur de 11 ans."
    cover_url: "https://inventaire.io/img/entities/1ada2969a7c64ba93e8ff09bd3cc121b5a12bf7d"

