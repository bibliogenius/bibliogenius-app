#       `python scripts/validate_isbns.py` before shipping to catch stale ones.
id: english-modern-classics
version: 1

title:
  fr: Classiques modernes anglophones (VO)
  en: English-language modern classics
  de: Moderne Klassiker auf Englisch
  es: Clásicos modernos en inglés

description:
  fr: "20e siècle anglophone en version originale : Orwell, Fitzgerald, Austen, Lee, Salinger."
  en: "20th-century English-language classics in the original: Orwell, Fitzgerald, Austen, Lee, Salinger."
  de: "Englischsprachige Klassiker des 20. Jahrhunderts im Original: Orwell, Fitzgerald, Austen, Lee, Salinger."
  es: "Clásicos anglófonos del siglo XX en versión original: Orwell, Fitzgerald, Austen, Lee, Salinger."

contributor: BiblioGenius
